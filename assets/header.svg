<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Heitor Ribeiro, Full Stack Developer">
<style>.rise{animation:rise 1.4s cubic-bezier(.22,1,.36,1) both}
.rise2{animation:rise 1.4s .25s cubic-bezier(.22,1,.36,1) both}
.ln{transform-origin:450px 178px;animation:grow 1.6s .3s cubic-bezier(.22,1,.36,1) both}
.sh{animation:sh 5s 2s ease-in-out infinite both}
.ph{opacity:0;animation:ph 12s infinite both}
@keyframes rise{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:none}}
@keyframes grow{0%{transform:scaleX(0);opacity:0}100%{transform:scaleX(1);opacity:1}}
@keyframes sh{0%{transform:translateX(0)}100%{transform:translateX(560px)}}
@keyframes ph{0%{opacity:0;transform:translateY(6px)}3%,22%{opacity:1;transform:none}25%,100%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1f24"/><stop offset="1" stop-color="#14181d"/></linearGradient></defs><rect x=".5" y=".5" width="899" height="299" rx="16" fill="url(#bg)" stroke="#2d333b"/><g fill="none" stroke="#C9A96E" stroke-opacity=".55" stroke-width="1.2"><path d="M22 48V22H48"/><path d="M852 22H878V48"/><path d="M22 252V278H48"/><path d="M852 278H878V252"/></g><text class="rise" x="450" y="82" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" letter-spacing="7" fill="#C9A96E">PORTFÓLIO</text><text class="rise2" x="450" y="152" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="52" letter-spacing="8" fill="#E6D5B8">HEITOR RIBEIRO</text><g class="ln"><defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#C9A96E" stop-opacity="0"/><stop offset=".5" stop-color="#C9A96E"/><stop offset="1" stop-color="#C9A96E" stop-opacity="0"/></linearGradient></defs><rect x="230" y="177.3" width="440" height="1.4" fill="url(#lg)"/></g><defs><clipPath id="lc"><rect x="230" y="176" width="440" height="4"/></clipPath><linearGradient id="shg" x1="0" x2="1"><stop offset="0" stop-color="#F5E6C4" stop-opacity="0"/><stop offset=".5" stop-color="#F5E6C4"/><stop offset="1" stop-color="#F5E6C4" stop-opacity="0"/></linearGradient></defs><g clip-path="url(#lc)"><rect class="sh" x="150" y="176.6" width="120" height="2.8" fill="url(#shg)"/></g><path d="M450 171L457 178L450 185L443 178Z" fill="#C9A96E" stroke="#14181d" stroke-width="3" paint-order="stroke"/><text class="ph" style="animation-delay:0s;opacity:1" x="450" y="232" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="21" fill="#E6D5B8">Desenvolvedor Full Stack em formação</text><text class="ph" style="animation-delay:3s" x="450" y="232" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="21" fill="#E6D5B8">Ciência da Computação no IESB</text><text class="ph" style="animation-delay:6s" x="450" y="232" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="21" fill="#E6D5B8">Código que resolve problema real</text><text class="ph" style="animation-delay:9s" x="450" y="232" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="21" fill="#E6D5B8">Sempre aprendendo algo novo</text><text x="450" y="272" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" letter-spacing="5" fill="#8A7548">BRASÍLIA · DF</text>
</svg>
